<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Prompt Enhancer</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <div class="container">
      <h1>Prompt Enhancer</h1>
      <button id="grab-btn">Grab selected prompt</button>
      <textarea id="prompt-input" placeholder="Or paste prompt here..."></textarea>
      <div class="actions">
        <button id="enhance-btn">Enhance to JSON</button>
        <button id="copy-btn">Copy JSON</button>
      </div>
      <pre id="result" class="result"></pre>
      <div id="status" class="status"></div>
    </div>

    <script src="popup.js"></script>
  </body>
</html>
